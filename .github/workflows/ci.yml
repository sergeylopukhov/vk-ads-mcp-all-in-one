name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Select verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          scope=full
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
            if [[ -s changed-files.txt ]]; then
              scope=docs
              while IFS= read -r file; do
                case "$file" in
                  README.md|LICENSE|docs/*) ;;
                  *)
                    scope=full
                    break
                    ;;
                esac
              done < changed-files.txt
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.scope.outputs.scope == 'full'
        run: npm ci
      - name: Run full verification
        if: steps.scope.outputs.scope == 'full'
        run: npm run check:ci
      - name: Check documentation
        if: steps.scope.outputs.scope == 'docs'
        run: |
          npm run check:repo
          npm run check:docs
